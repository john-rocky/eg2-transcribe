# EG2 Transcribe — speech to text on the iPhone and the Mac with Core AI: the EmbeddingGemma 2 audio encoder and the
# eg2-transcribe reader, one SwiftUI code base for both. `xcodegen generate` in this folder, then open
# EG2Transcribe.xcodeproj (the project file is generated, not committed).
name: EG2Transcribe
options:
  bundleIdPrefix: com.coreai
  createIntermediateGroups: true

# Hub = swift-transformers' Hugging Face downloader (the version CoreAISearchiOS resolves).
# Core AI itself is an SDK framework: no package.
packages:
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4

# Run config Release: the timings in the README are Release numbers.
schemes:
  EG2Transcribe:
    build:
      targets:
        EG2Transcribe: all
    run:
      config: Release
  EG2TranscribeMac:
    build:
      targets:
        EG2TranscribeMac: all
    run:
      config: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: EG2 Transcribe
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Record speech to transcribe it on this device.

targets:
  EG2Transcribe:
    type: application
    supportedDestinations: [iOS]
    deploymentTarget:
      iOS: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: swift-transformers
        product: Hub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai.eg2transcribe
        DEVELOPMENT_TEAM: MFN25KNUGJ
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Documents/ is visible in the Files app: the model folder can be copied there by hand.
        INFOPLIST_KEY_UIFileSharingEnabled: "YES"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: "YES"

  EG2TranscribeMac:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
    dependencies:
      - package: swift-transformers
        product: Hub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coreai.eg2transcribe.mac
        PRODUCT_NAME: EG2Transcribe
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ARCHS: arm64
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
