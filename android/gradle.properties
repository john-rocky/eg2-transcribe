org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official
# LiteRT's AAR depends on AndroidX libraries.
android.useAndroidX=true
# AGP 8.9.1 was tested up to compileSdk 35; this app compiles against 36 (targetSdk 36).
android.suppressUnsupportedCompileSdk=36
# The LiteRT runtime. 2.2.0 is the release the Qualcomm NPU libraries of tools/fetch_npu_libs.sh belong to.
# -Plitert.version=2.3.0 builds with 2.3.0 (CPU and GPU; its NPU libraries come from another source, README.md).
litert.version=2.2.0
